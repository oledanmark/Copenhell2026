name: Copenhell-vagt

on:
  schedule:
    - cron: "*/14 * * * *"   # ca. hvert 14. minut (GitHub forsinker ofte lidt -> ~100 tjek i døgnet)
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Send en testmail (ja/nej)"
        default: "nej"

permissions:
  contents: write

concurrency:
  group: copenhell-vagt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tjek billetsiden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ github.event.inputs.test_mail == 'ja' && '1' || '0' }}
        run: python check.py

      - name: Gem tilstand (så du ikke får samme mail flere gange)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "copenhell-vagt"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Opdater tilstand"
            git push
          fi
